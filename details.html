<!DOCTYPE html>
<html>
<head>
<title>Event Details</title>
<meta charset="UTF-8">
<style>
body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(to bottom,#f0f4ff,#ffffff);}
header{background:linear-gradient(to right,#141e30,#243b55);color:white;padding:15px;text-align:center;}
.banner{width:100%;height:380px;object-fit:cover;}
.container{max-width:900px;margin:30px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.2);}
h2{text-align:center;margin-top:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:20px 0;}
.box{background:#f6f9ff;padding:15px;border-radius:8px;border-left:5px solid #5b86e5;}
.box span{font-weight:bold;}
#status{text-align:center;font-size:18px;margin:15px 0;font-weight:bold;}
#countdown{text-align:center;font-size:20px;margin:15px 0;color:#764ba2;}
.btn{display:block;width:220px;margin:20px auto;background:linear-gradient(to right,#36d1dc,#5b86e5);color:white;padding:12px;border:none;border-radius:25px;font-size:16px;cursor:pointer;transition:0.3s;}
.btn:hover{transform:scale(1.05);}
.btn:disabled{background:gray;cursor:not-allowed;transform:none;}
#msg{text-align:center;font-size:16px;font-weight:bold;margin-top:10px;}
footer{text-align:center;padding:15px;color:#555;}
</style>
</head>
<body>
<header><h1>Event Information</h1></header>
<img id="img" class="banner" src="" alt="Event Banner">
<div class="container">
  <h2 id="title"></h2>
  <p id="info"></p>
  <div id="status"></div>
  <div id="countdown"></div>
  <div class="grid">
    <div class="box"><span>📍 Venue:</span><p id="venue"></p></div>
    <div class="box"><span>🗓 Date:</span><p id="date"></p></div>
    <div class="box"><span>⏰ Time:</span><p id="time"></p></div>
  </div>
  <button class="btn" id="bookBtn" onclick="bookEvent()">Book Now</button>
  <div id="msg"></div>
</div>
<footer>© 2026 VIT Event Portal</footer>

<script>
/* ===== EVENT DATABASE ===== */
const data = {
  "Vibrance":   { img:"vibrance.jpg",   info:"Vibrance is the annual cultural fest featuring dance, music, drama, art exhibitions, fashion shows and inter-college competitions.", venue:"MG Auditorium",      date:"2026-02-18", time:"9:00 AM - 6:00 PM" },
  "Christmas":  { img:"christmas.jpg",  info:"Christmas celebration with choir, cultural performances, carol singing, stage plays and community programs.",                        venue:"Netaji Auditorium",  date:"2026-12-24", time:"4:00 PM - 8:00 PM" },
  "FootBall Tournament": { img:"foo.png",  info:"Inter-department football tournament encouraging teamwork, leadership and sportsmanship.", venue:"Football Ground", date:"2026-03-12", time:"8:00 AM - 5:00 PM" },
  "Championship Trophy": { img:"ch.webp", info:"Cricket championship involving teams from various colleges with knockout rounds.",          venue:"Cricket Ground",  date:"2026-04-07", time:"9:00 AM - 4:00 PM" },
  "Student Workshop":           { img:"stu.PNG", info:"Skill-based workshop on emerging technologies, project development and career readiness.", venue:"Kamaraj Auditorium", date:"2026-02-11", time:"10:00 AM - 1:00 PM" },
  "Seminar on Sustainability goals": { img:"sus.png", info:"Awareness seminar on sustainable development goals, climate change and environmental protection.", venue:"Netaji Auditorium", date:"2026-04-16", time:"11:00 AM - 3:00 PM" },
  "DevsHouse":    { img:"dev.png", info:"36-hour developer conference with coding contests, startup talks, mentorship and hack sessions. OD will be provided.", venue:"MG Auditorium",      date:"2026-03-25", time:"9:00 AM - 9:00 PM" },
  "5G HACKATHON": { img:"co.png",  info:"24-hour national-level hackathon focused on 5G applications, IoT and smart systems. OD will be provided.",             venue:"Kamaraj Auditorium", date:"2026-01-02", time:"10:00 AM - Next Day" }
};

const params    = new URLSearchParams(window.location.search);
const eventName = params.get("event");
const bookBtn   = document.getElementById("bookBtn");
const msgEl     = document.getElementById("msg");

let eventIsPast = false;

/* ===== LOAD DATA ===== */
if (eventName && data[eventName]) {
  const e = data[eventName];
  document.getElementById("title").innerText = eventName;
  document.getElementById("img").src         = e.img;
  document.getElementById("info").innerText  = e.info;
  document.getElementById("venue").innerText = e.venue;
  document.getElementById("time").innerText  = e.time;

  // Format date nicely for display
  const dateObj = new Date(e.date);
  document.getElementById("date").innerText  = dateObj.toDateString();

  setupTimer(e.date, e.time);
} else {
  document.getElementById("title").innerText = "Event not found";
  bookBtn.disabled = true;
}

/* ===== COUNTDOWN & STATUS ===== */
function setupTimer(dateStr, timeStr) {
  const startTime = timeStr.split("-")[0].trim();
  const start     = new Date(dateStr + " " + startTime);
  const statusEl  = document.getElementById("status");
  const cdEl      = document.getElementById("countdown");

  function tick() {
    const now  = new Date();
    const diff = start - now;

    if (diff > 0) {
      // Upcoming
      statusEl.innerText    = "🟢 Status: Upcoming";
      statusEl.style.color  = "green";
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      cdEl.innerText = `⏳ Starts in ${d}d ${h}h ${m}m`;
      eventIsPast    = false;
      bookBtn.disabled  = false;
      bookBtn.style.background = "linear-gradient(to right,#36d1dc,#5b86e5)";
      bookBtn.innerText = "Book Now";
    } else if (diff > -6 * 3600000) {
      // Ongoing
      statusEl.innerText    = "🟠 Status: Ongoing";
      statusEl.style.color  = "orange";
      cdEl.innerText        = "🔥 Event is Live Now";
      eventIsPast           = false;
      bookBtn.disabled      = false;
      bookBtn.style.background = "linear-gradient(to right,#36d1dc,#5b86e5)";
      bookBtn.innerText     = "Book Now";
    } else {
      // Completed
      statusEl.innerText    = "🔴 Status: Completed";
      statusEl.style.color  = "red";
      cdEl.innerText        = "Event Finished";
      eventIsPast           = true;
      bookBtn.disabled      = true;
      bookBtn.style.background = "gray";
      bookBtn.innerText     = "Booking Closed";
    }
  }

  tick();
  setInterval(tick, 1000);
}

/* ===== BOOKING ===== */
function bookEvent() {
  if (eventIsPast) {
    showMsg("❌ This event has already ended. Booking is closed.", "red");
    return;
  }

  const user = JSON.parse(localStorage.getItem("loggedUser"));
  if (!user) {
    localStorage.setItem("pendingEvent", eventName);
    location.href = "login.html";
    return;
  }

  bookBtn.disabled  = true;
  bookBtn.innerText = "Registering...";

  fetch('/api/bookings', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      reg:   user.reg,
      name:  user.name,
      email: user.email,
      event: eventName,
      time:  new Date().toLocaleString()
    })
  })
  .then(res => res.json().then(d => ({ status: res.status, body: d })))
  .then(response => {
    if (response.status === 201) {
      showMsg("✅ Booking Successful! Redirecting...", "green");
      setTimeout(() => location.href = "mybookings.html", 1500);
    } else if (response.status === 409) {
      showMsg("⚠️ You have already registered for this event!", "orange");
      bookBtn.disabled  = false;
      bookBtn.innerText = "Book Now";
    } else {
      showMsg("❌ " + (response.body.error || "Booking failed!"), "red");
      bookBtn.disabled  = false;
      bookBtn.innerText = "Book Now";
    }
  })
  .catch(err => {
    console.error(err);
    showMsg("❌ Network error. Please try again.", "red");
    bookBtn.disabled  = false;
    bookBtn.innerText = "Book Now";
  });
}

function showMsg(text, color) {
  msgEl.innerText    = text;
  msgEl.style.color  = color;
}
</script>
</body>
</html>
